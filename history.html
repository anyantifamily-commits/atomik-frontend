
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atomik History</title>

    <link rel="stylesheet" href="history.css">

</head>


<body>

    <main class="history-container">

        <!-- HEADER -->

        <header class="history-header">

            <div>

                <div class="brand">

                    <div class="atomik-symbol">
                        A
                    </div>

                    <div class="atomik-name">
                        ATOMIK
                    </div>

                </div>

                <h1>
                    Quiz History
                </h1>

                <p>
                    Review your previous quiz attempts.
                </p>

            </div>


            <a
                href="index.html"
                class="back-btn"
            >
                ← Generator
            </a>

        </header>


        <!-- HISTORY -->

        <section
            class="history-list"
            id="historyList"
        >

            <!-- JavaScript inserts history here -->

        </section>


        <!-- EMPTY STATE -->

        <section
            class="empty-state"
            id="emptyState"
        >

            <div class="empty-icon">
                ◷
            </div>

            <h2>
                No quiz history yet
            </h2>

            <p>
                Complete a quiz and your attempt
                will appear here.
            </p>

            <a
                href="index.html"
                class="start-btn"
            >
                Create a Quiz
            </a>

        </section>


        <!-- CLEAR HISTORY -->

        <button
            type="button"
            id="clearHistoryBtn"
            class="clear-history-btn"
        >
            Clear History
        </button>

    </main>


    <!-- CUSTOM CONFIRMATION MODAL -->

    <div
        class="confirm-overlay"
        id="confirmOverlay"
        aria-hidden="true"
    >

        <div
            class="confirm-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="confirmTitle"
            aria-describedby="confirmMessage"
        >

            <div class="confirm-icon" id="confirmIcon">
                !
            </div>

            <h2 id="confirmTitle">
                Delete Quiz?
            </h2>

            <p id="confirmMessage">
                Are you sure you want to delete this quiz?
            </p>

            <div class="confirm-actions">

                <button
                    type="button"
                    id="confirmCancelBtn"
                    class="confirm-cancel-btn"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    id="confirmDeleteBtn"
                    class="confirm-delete-btn"
                >
                    Delete
                </button>

            </div>

        </div>

    </div>


<script
    type="module"
    src="history.js"
></script>

</body>

</html>
